name: Deploy Music Chat Lab to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Music Chat Lab
        uses: actions/checkout@v4
        with:
          repository: wibem1/Music-Chat-Lab
          ref: main
          path: source

      - name: Build clean Pages artifact
        shell: bash
        run: |
          mkdir public
          cp source/index.html public/
          cp source/styles.css public/
          cp source/app.js public/
          cp source/music-file-processing.js public/
          cp source/engine14-output.js public/
          cp source/android-download-fix.js public/
          cp source/manifest.webmanifest public/
          cp source/icon.svg public/
          cat > public/service-worker.js <<'EOF'
          const CACHE_NAME = "music-chat-lab-pages-v0-4-7";
          const APP_SHELL = [
            "./", "./index.html", "./styles.css", "./app.js",
            "./music-file-processing.js", "./engine14-output.js",
            "./android-download-fix.js", "./manifest.webmanifest", "./icon.svg"
          ];
          self.addEventListener("install", event => event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL))));
          self.addEventListener("activate", event => event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))))));
          self.addEventListener("fetch", event => {
            if (event.request.method !== "GET") return;
            event.respondWith(fetch(event.request).then(response => {
              const copy = response.clone();
              caches.open(CACHE_NAME).then(cache => cache.put(event.request, copy));
              return response;
            }).catch(() => caches.match(event.request).then(hit => hit || caches.match("./index.html"))));
          });
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
