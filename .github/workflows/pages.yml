name: Deploy Music Chat Lab to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment snapshot
        uses: actions/checkout@v4

      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mcl-pages"
          mkdir -p "$RUNNER_TEMP/mcl-pages"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'public/' \
            ./ "$RUNNER_TEMP/mcl-pages/"
          test -f "$RUNNER_TEMP/mcl-pages/index.html"
          test -f "$RUNNER_TEMP/mcl-pages/service-worker.js"
          test -f "$RUNNER_TEMP/mcl-pages/composition-engine14.js"
          test -f "$RUNNER_TEMP/mcl-pages/concept-openai.js"
          test -f "$RUNNER_TEMP/mcl-pages/midi-stop-reset.js"
          test -f "$RUNNER_TEMP/mcl-pages/music-file-processing.js"
          test -f "$RUNNER_TEMP/mcl-pages/clab-document-v1.js"
          grep -Fq 'data-app-version>v1.1.17<' "$RUNNER_TEMP/mcl-pages/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mcl-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
