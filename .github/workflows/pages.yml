name: Deploy Music Chat Lab to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Music Chat Lab source of truth
        uses: actions/checkout@v4
        with:
          repository: wibem1/Music-Chat-Lab
          ref: main
          path: source

      - name: Build Pages artifact from source of truth
        shell: bash
        run: |
          mkdir public
          rsync -a \
            --exclude '.git/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            source/ public/
          test -f public/index.html
          test -f public/service-worker.js
          test -f public/composition-engine14.js
          test -f public/music-file-processing.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
